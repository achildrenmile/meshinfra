name: Build and push to GHCR

# Baut nur bei einem bewusst gesetzten Versions-Tag (v*), nicht bei jedem
# Commit. Drei separate Jobs fuer die drei eigenen Images dieses Stacks
# (ratelimit, webui, meshcore-mqtt) - alle teilen sich einen Git-Tag/
# Release-Zyklus.
#
# meshcore-mqtt: 2026-09-09 nachtraeglich ergaenzt. Der zuvor laufende Tag
# "v0.1.3-patched" hatte keine Entsprechung in Git (Patch nur manuell
# angewendet und als fertiges Image gepusht) - der Patch wurde aus dem
# laufenden Produktions-Container zurueckextrahiert, gegen Upstream-v0.1.3
# verifiziert und in config/meshcore-mqtt/mqtt_worker.py + README.md
# versioniert. Siehe dort fuer Details zum eigentlichen Bug/Fix.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  ratelimit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./config/ratelimit
          push: true
          tags: ghcr.io/achildrenmile/meshinfra-ratelimit:${{ github.ref_name }}

  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./config/webui
          push: true
          tags: ghcr.io/achildrenmile/meshinfra-webui:${{ github.ref_name }}

  meshcore-mqtt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./config/meshcore-mqtt
          push: true
          tags: ghcr.io/achildrenmile/meshinfra-meshcore-mqtt:v0.1.3-patched
