persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Authentifizierung. Datei gehoert uid 1883 (mosquitto im Container), Modus 600.
# Benutzer anlegen/aendern - Datei danach wieder auf 1883:1883 / 600 setzen:
#   cd ~/stacks/meshinfra/config/mosquitto
#   docker run --rm --user $(id -u):$(id -g) -v "$PWD":/work eclipse-mosquitto:2 \
#     mosquitto_passwd -b /work/passwd USER PASS
#   docker run --rm -v "$PWD":/work alpine:3 \
#     sh -c 'chown 1883:1883 /work/passwd && chmod 600 /work/passwd'
# -c legt die Datei NEU an und wirft alle bestehenden Benutzer weg. Beim
# Hinzufuegen also ohne -c.
allow_anonymous false
password_file /mosquitto/config/passwd

# ACLs trennen Einlieferung von Ausfuehrung. Nur das Rate-Limit-Gate darf auf
# meshinfra/command/# schreiben - sonst waere das Limit umgehbar, indem man
# direkt auf das Kommando-Topic publiziert.
acl_file /mosquitto/config/acl

listener 1883
protocol mqtt
